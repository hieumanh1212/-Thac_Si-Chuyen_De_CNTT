[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid RAG (BM25 + FAISS + RRF) với nhiều chiến lược chunking"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["rag*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
